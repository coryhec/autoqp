name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: |
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          # username.github.io repos are served from the root; others from /repo-name/
          if [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            export BASE_PATH="/"
          else
            export BASE_PATH="/${REPO}/"
          fi
          npx vite build --config vite.config.static.ts

      - name: Create index.html and 404.html from the SPA shell
        run: |
          cd dist/client
          echo "Build output:"; ls -la
          # TanStack Start SPA mode writes the app shell to _shell.html by default
          if [ -f _shell.html ]; then
            cp _shell.html index.html
          fi
          if [ ! -f index.html ]; then
            echo "ERROR: no _shell.html or index.html found in dist/client" >&2
            exit 1
          fi
          # GitHub Pages serves 404.html for unknown paths, so deep links and refresh still load the app
          cp index.html 404.html

      - run: touch dist/client/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
